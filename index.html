<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#16233b">
<title>Pizarra de Informática | TEMI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:#16233b;
  color:white;
  padding:28px 5%;
}

.cabecera{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

header h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
}

header p{
  margin:8px 0 0;
  font-size:clamp(17px,2.5vw,23px);
  opacity:.75;
}

.reloj{
  text-align:right;
  font-weight:bold;
  font-size:28px;
  white-space:nowrap;
}

.fecha{
  font-size:15px;
  font-weight:normal;
  opacity:.75;
  margin-top:5px;
}

.contenedor{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.panel{
  background:white;
  padding:28px;
  border-radius:22px;
  box-shadow:0 5px 22px rgba(0,0,0,.07);
}

h2{
  margin:0 0 22px;
  font-size:30px;
}

.formulario{
  display:grid;
  grid-template-columns:1fr 190px 180px;
  gap:12px;
}

input,select,button{
  min-height:62px;
  font-size:20px;
  border-radius:14px;
}

input,select{
  border:2px solid #dce2eb;
  padding:12px 16px;
  background:white;
}

input:focus,select:focus{
  outline:3px solid #b9ddce;
  border-color:#20a36d;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
  touch-action:manipulation;
}

.agregar{
  background:#20a36d;
  color:white;
}

.agregar:active{
  transform:scale(.98);
}

.contadores{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:25px 0;
}

.contador{
  background:white;
  padding:20px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
  font-size:18px;
}

.numero{
  display:block;
  font-size:36px;
  font-weight:bold;
  margin-bottom:5px;
}

.enc
